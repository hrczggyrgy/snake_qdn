name: Apply rendering implementation

on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-rendering.yml]
  workflow_dispatch:

concurrency:
  group: apply-rendering-implementation
  cancel-in-progress: false

jobs:
  implement:
    if: github.repository == 'hrczggyrgy/snake_qdn' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply the exact reviewed replacement patch
        shell: bash
        run: |
          set -euo pipefail
          git show 029cac85fff417b920a5136d0b0956547fae15e9:render-game-and-charts.patch > /tmp/rendering.patch
          if git apply --reverse --check /tmp/rendering.patch 2>/dev/null; then
            echo "Rendering patch is already applied."
          else
            git apply --check /tmp/rendering.patch
            git apply /tmp/rendering.patch
          fi
          python -m compileall -q app.py game_canvas.py
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Run existing module tests
        run: python test_modules.py
      - name: Run Streamlit rendering smoke tests
        run: python test_rendering_smoke.py
      - name: Commit implementation only after tests pass
        shell: bash
        run: |
          set -euo pipefail
          git add app.py game_canvas.py requirements.txt RENDERING_PATCH.md
          if git diff --cached --quiet; then
            echo "No implementation changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Implement canvas game rendering and fragment-owned charts"
          git push origin HEAD:main
